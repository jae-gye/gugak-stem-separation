[project]
name = "gugak-stem-separation"
version = "0.1.0"
description = "Stem separation on a traditional Korean music (gugak) multitrack dataset (AI Hub 71955)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "soundfile",
    "tqdm",
    "matplotlib",
    "ipykernel",
    "pyloudnorm>=0.2.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
]

# Application project (no build-system) -> uv manages the env, does not build the root as a package.
[tool.uv]
package = false

# PyTorch: Blackwell GPUs (RTX Pro 6000, sm_120) need the CUDA 12.8 build.
# Pin torch/torchaudio to that index; everything else resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "koreanize-matplotlib>=0.1.1",
    "nbstripout>=0.9.1",
]
